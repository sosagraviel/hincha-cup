# Generated by QACluster.
# Runs the E2E framework in gritogol/e2e on every PR and push to main. Does not use QACluster or Claude.
name: e2e

on:
  pull_request:
    paths: ['gritogol/**', '.github/workflows/qa-cluster-e2e.yml']
  push:
    branches: [main, deploy-prod, 'qa/**']
    paths: ['gritogol/**', '.github/workflows/qa-cluster-e2e.yml']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest # needs Docker + make: the app runs as the docker compose stack (web + Firebase emulators)
    timeout-minutes: 45
    defaults:
      run:
        working-directory: gritogol/e2e
    env:
      CI: "true"
      BASE_URL: http://localhost:5173
      FIRESTORE_EMULATOR_URL: http://127.0.0.1:8081
      FIREBASE_PROJECT_ID: gritogol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gritogol/e2e/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts webServer starts the stack in the foreground (`docker compose up --build`, cwd gritogol/)
      # and every scenario resets the local Firestore emulator + runs `make seed` (freshData fixture).
      - run: npx bddgen && npx playwright test

      - name: Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            gritogol/e2e/playwright-report/
            gritogol/e2e/cucumber-report/
            gritogol/e2e/test-results/
          retention-days: 14

      # Case table on the run's Summary page
      - name: Test summary
        if: ${{ !cancelled() }}
        run: cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "No test-results/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # Public HTML report (GitHub Pages): landing page + Playwright report + Cucumber report of the LAST run
      - name: Build report site
        if: ${{ !cancelled() }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p site
          [ -d playwright-report ] && cp -r playwright-report site/playwright
          [ -d cucumber-report ] && cp -r cucumber-report site/cucumber
          node -e '
            const fs = require("fs");
            const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
            const md = fs.existsSync("test-results/summary.md") ? fs.readFileSync("test-results/summary.md", "utf8") : "No summary.";
            const e = process.env;
            fs.writeFileSync("site/index.html", `<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
          <title>E2E report</title><style>body{font:15px/1.5 system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem}
          pre{background:#f4f4f6;padding:1rem;overflow:auto}a.b{display:inline-block;margin:.3rem .6rem .3rem 0;padding:.5rem .9rem;border:1px solid #888;border-radius:6px;text-decoration:none}</style>
          <h1>E2E report</h1><p>Branch <b>${esc(e.BRANCH)}</b> · commit <code>${e.SHA.slice(0,7)}</code> · ${new Date().toISOString().slice(0,16).replace("T"," ")} UTC · <a href="${e.RUN_URL}">CI run</a></p>
          <p><a class="b" href="playwright/index.html">Playwright report</a><a class="b" href="cucumber/index.html">Cucumber report</a></p>
          <h2>Summary</h2><pre>${esc(md)}</pre>`);
          '

      - name: Upload report site
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: gritogol/e2e/site

  publish-report:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
