# Generated by QACluster.
# Runs the E2E framework in gritogol/e2e on every PR and push to main. Does not use QACluster or Claude.
name: e2e

on:
  pull_request:
    paths: ['gritogol/**', '.github/workflows/qa-cluster-e2e.yml']
  push:
    branches: [main, deploy-prod, 'qa/**']
    paths: ['gritogol/**', '.github/workflows/qa-cluster-e2e.yml']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest # needs Docker + make: the app runs as the docker compose stack (web + Firebase emulators)
    timeout-minutes: 45
    defaults:
      run:
        working-directory: gritogol/e2e
    env:
      CI: "true"
      BASE_URL: http://localhost:5173
      FIRESTORE_EMULATOR_URL: http://127.0.0.1:8081
      FIREBASE_PROJECT_ID: gritogol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gritogol/e2e/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts webServer starts the stack in the foreground (`docker compose up --build`, cwd gritogol/)
      # and every scenario resets the local Firestore emulator + runs `make seed` (freshData fixture).
      - run: npx bddgen && npx playwright test

      - name: Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            gritogol/e2e/playwright-report/
            gritogol/e2e/cucumber-report/
            gritogol/e2e/test-results/
          retention-days: 14
